interface:
  display_name: "小说 DNA 拆解套件 V1.4"
  short_description: "统一拆解世界势力、多修炼体系、功法法宝等小说 DNA 组件并输出可审计候选"
  default_prompt: >-
    使用 $novel-dna-mining-suite 按总控冻结的输入包拆解指定书单。先按模块读取包内 references，再运行 scripts/validate.py 分派对应 validator。保持 candidate-only、结构化 evidence_refs、UNKNOWN/gap/HOLD、per_book/gap completion manifest 和跨书阶段门；世界观提取有证据的 factions，修炼体系按来源实际存在数量提取 system/realm/technique/artifact/resource，禁止为模板完整补造；拆书层禁止跨书拼装来源事实；章节情绪只服从包内唯一 canonical schema；不要修改正式素材库。
