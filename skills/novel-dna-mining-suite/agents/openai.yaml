interface:
  display_name: "小说 DNA 拆解套件 V1.7.0"
  short_description: "Staged mechanism-family discovery + V1.6.x 拆解兼容"
  default_prompt: >-
    使用 $novel-dna-mining-suite V1.7.0。新增跨书机制研究必须先读取 references/core/mechanism-family-contract.md 与 references/core/mechanism-family-workflow.md，按 MECHANISM_CARD_EXTRACTION → READINESS_NORMALIZATION → PAIR_CALIBRATION → FAMILY_PILOT → BOUNDARY_STRESS_TEST → DOMAIN_EXPANSION → DOMAIN_FULL → optional CROSS_DOMAIN_ONTOLOGY → FULL_LIBRARY 推进，并遵守每阶段人工 STOP。关键词、embedding、connected components、single-link 只能做召回，不能决定 family membership；每个成员必须独立通过 family definition test，card count 不等于 independent implementation count。V1.6.x source routing、derived/combat/supplemental gates 继续有效，legacy semantic recluster 仅用于回归验证。
