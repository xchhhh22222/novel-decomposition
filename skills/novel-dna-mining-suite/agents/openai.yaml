interface:
  display_name: "小说 DNA 拆解套件 V1.6.1"
  short_description: "完整拆书/定向补素材 + Derived Material 严格规范"
  default_prompt: >-
    使用 $novel-dna-mining-suite V1.6.1。FULL_DNA 与 SUPPLEMENTAL_MATERIAL 路由规则保持不变。凡生成 ability_assets、dungeon_rule_assets、relationship_engine_assets、charismatic_antagonist_assets、combat_expression_assets，必须先读取 references/core/derived-material-contract.md，输出 schema_version=2 的 canonical 记录，使用统一 record_id、字段名、精确 evidence_refs、unknowns/confidence/qa_status，并运行 scripts/core/validate_derived_materials.py。禁止自由字段、别名字段、章节区间 evidence、嵌套 combat assets 和人工 CONTRACT PASS 代替 dedicated validator。新来源仍不得 append 到旧 cluster，所有输出 candidate-only。
