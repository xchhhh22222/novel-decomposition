interface:
  display_name: "小说 DNA 拆解套件 V1.6"
  short_description: "双模式中控：FULL_DNA 完整拆书 / SUPPLEMENTAL_MATERIAL 定向补素材"
  default_prompt: >-
    使用 $novel-dna-mining-suite V1.6。任何新增来源先读取 references/core/source-role-and-routing.md；若为 SUPPLEMENTAL_MATERIAL 再读取 supplemental-profiles.md。第一轮只输出 routing matrix，不写正式拆解结果，等待用户确认。FULL_DNA 继续完整运行01—09及必需派生视图；SUPPLEMENTAL 只运行 target_specialties，但必须扫描授权全文范围保证专项 recall，并对必要 evidence window 做局部情绪 overlay。专项内部 schema/QA/validator 不得简化。所有产物 candidate-only，UNKNOWN/gap/HOLD 优先于补造；新来源不得 append 到旧 cluster，批次完成后只对受影响专项开启新的 full recluster 并保留 lineage。
