interface:
  display_name: "篇章阶段结构横向拆解器"
  short_description: "横向拆解长篇小说的阶段边界、推进、转折、收束与下一阶段入口"
  default_prompt: "使用 $novel-arc-structure-miner 横向拆解指定书单的长篇阶段结构。每本书的 per_book 使用 arcs[] 覆盖多个独立阶段，不得只选一个代表性阶段。只使用 orchestrator 允许的书籍、章节与来源，核心分析 arc_boundary、arc_goal、arc_pressure、arc_progression、arc_turning_points、arc_climax_or_resolution、arc_state_change、next_arc_entry、arc_function、nested_structure。明确 arc 不等于 plotline、chapter summary、volume title、time period、map change 或 cultivation stage；progression 不等于 event accumulation，turning point 不等于普通高潮，resolution 不要求胜利，并区分 resolved、failed、abandoned、redirected、unresolved、UNKNOWN。arc_state_change 与 next_arc_entry 独立追踪；nested arc 独立取证，sub-arc resolved 不等于 parent resolved、sub-arc failed 不等于 parent failed、parent paused 不自动暂停 sub-arc，禁止自引用与循环。相邻专项只作 interface/evidence；证据不足保留 partial、UNKNOWN、gap 或 HOLD。所有输出保持 candidate-only，禁止 active/deprecated，禁止修改正式素材库；全部目标书完成单书 QA 后才允许 nearest-neighbor / clustering，并用 --expected-books、--all-books-complete 和 --completion-manifest 通过可验证阶段门。固定交付 per_book、nearest_neighbors、clusters、qa、handoff，最终必须通过 scripts/validate_outputs.py；validator 失败时不得伪造边界、转折、收束、嵌套关系或删除 UNKNOWN 绕过。"
