interface:
  display_name: "小说 DNA 总控 V1.6.2"
  short_description: "双模式路由 + Derived Contract + Supplemental 三道批次硬门"
  default_prompt: >-
    使用 $novel-dna-orchestrator V1.6.2。保留 V1.6.1 的 FULL_DNA / SUPPLEMENTAL_MATERIAL 路由和五类 Derived Material canonical contract。Supplemental 批次完成后必须额外读取 references/supplemental-batch-gates.md，并运行 scripts/validate_supplemental_batch.py：1) source_route.derived_views 必须与真实 derived outputs/checked gaps 对账；2) controlled derived 出现 qa_status=HOLD 时 manifest 与 batch-status 必须为 COMPLETE_SUPPLEMENTAL_SOURCE_WITH_HOLDS；3) 只有 qa_status=PASS 的 controlled derived record 才能进入 nearest_neighbor / KEEP_SEPARATE / cluster，HOLD 只留 inventory。若任何需要重聚类的 view records>0 但 eligible=0，则 full_recluster_ready=false。禁止为完成聚类把 HOLD 改 PASS，所有输出继续 candidate-only。
