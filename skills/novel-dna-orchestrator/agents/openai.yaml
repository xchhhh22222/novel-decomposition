interface:
  display_name: "小说 DNA 总控 V1.7.0"
  short_description: "V1.7 staged family discovery + source routing 总控"
  default_prompt: >-
    使用 $novel-dna-orchestrator V1.7.0。新增来源仍先执行 FULL_DNA / SUPPLEMENTAL_MATERIAL 路由与既有 derived/combat/batch gates；进入新跨书机制研究后，必须调度 V1.7 staged mechanism-family flow：MECHANISM_CARD_EXTRACTION → READINESS_NORMALIZATION → PAIR_CALIBRATION → FAMILY_PILOT → BOUNDARY_STRESS_TEST → DOMAIN_EXPANSION → DOMAIN_FULL → optional CROSS_DOMAIN_ONTOLOGY → FULL_LIBRARY。PAIR/FAMILY/BOUNDARY/每次 EXPANSION 后停止给人工审核；CALIBRATION_REQUIRED lane 在 expansion 前需 APPROVE_LANE_VALIDATION；DOMAIN_FULL/FULL_LIBRARY/PROMOTION 分别要求显式批准。不得用旧 cluster membership、graph transitivity、embedding 或 single-link 代替语义判断。
