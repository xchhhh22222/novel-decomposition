interface:
  display_name: "小说 DNA 总控 V1.6"
  short_description: "先路由来源角色，再调度完整拆书或定向素材扩充"
  default_prompt: >-
    使用 $novel-dna-orchestrator V1.6。新增 TXT 先盘点、去重、分配 BOOK_ID，并判断 FULL_DNA 或 SUPPLEMENTAL_MATERIAL；先给出 purpose / target_specialties / derived_views / excluded_specialties 的 routing matrix，用户确认前不写正式拆解。确认后只调度授权 specialist；supplemental 的完成门只检查授权专项，不要求九专项齐全。批次结束后只对受影响专项 full recluster，禁止把新记录直接插入旧 cluster。
