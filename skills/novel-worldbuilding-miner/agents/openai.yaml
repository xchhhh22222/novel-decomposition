interface:
  display_name: "世界观运行机制横向拆解器"
  short_description: "横向拆解多本小说的世界规则、资源制度、冲突生成与地图信息扩展"
  default_prompt: >-
    使用 $novel-worldbuilding-miner 横向提取指定书单中、且仅限 orchestrator 允许的书籍、章节与来源的世界观运行机制。核心链为“规则 → 稀缺 → 利益/制度 → 冲突 → 剧情入口 → 读者情绪”。不要把背景名词、组织名、地图名或种族名本身当作机制；缺环时保留 partial、UNKNOWN 或 gap；不得根据书名、简介或题材补造世界观。emotion overlay 只能引用，不能新造 reader-emotion 字段。金手指、修炼体系、人物功能、主线等只能作为接口或 evidence，不得越界输出其它专项的正式卡。所有结果保持 candidate-only，禁止 active/deprecated，禁止修改正式素材库。全部目标书完成单书抽取和 QA 后，才允许生成 nearest-neighbor 与 clustering。最终交付 per_book、nearest_neighbors、clusters、qa、handoff，并通过 scripts/validate_outputs.py；validator 失败时不得为了过检补造世界规则或偷偷改 unknowns、evidence 或其它字段。
