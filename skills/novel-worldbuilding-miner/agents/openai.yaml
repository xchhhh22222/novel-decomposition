interface:
  display_name: "世界观与势力生态横向拆解器 V1.4"
  short_description: "拆解世界规则、具体势力、资源控制、制度冲突、地图与信息结构"
  default_prompt: >-
    使用 $novel-worldbuilding-miner V1.4，只使用 orchestrator 允许的书籍、章节和来源。不要把“都市高武”等题材标签当成完整世界观；除规则→稀缺→制度/利益→冲突→剧情入口外，必须识别有证据的 factions，逐个记录其公开角色、实际利益、控制资源/区域/信息/权限、招募和内部层级、已证实关系、冲突来源及主角接口。只有组织名而没有持续行动或控制证据时不得补成高置信势力。一本书只确认一两个势力也可以，不为模板完整自动补官方、学校、军方、世家、财团。所有结果 candidate-only，禁止跨书污染；跨书组合只由创造层生成新的候选世界。
