interface:
  display_name: "修炼成长系统横向拆解器 V1.4"
  short_description: "拆出原书实际存在的多体系、境界、功法、法宝、资源与体系关系"
  default_prompt: >-
    使用 $novel-cultivation-system-miner V1.4，只使用 orchestrator 允许的书籍、章节和来源。来源书实际出现几套体系就拆几套，允许只有一套或两套，严禁为了模板完整补造。每套 cultivation_system 必须有独立 system_id 与 realm_system；功法/武技写入 techniques，法宝/装备写入 artifacts，丹药/材料/晶核/积分等写入 resource_assets。只有原书存在两套以上体系时才写 system_relations，并区分并行、互斥、互补、转化、克制、依赖和融合。境界变化必须有直接证据；功法获得不等于掌握；装备与资源不等于人物正式突破。所有单书结果保持 candidate-only，禁止跨书污染。跨书组合只允许由 novel-creation-planner 生成新的【新书候选】，不得写回来源 per_book。最终通过 scripts/validate_outputs.py。
