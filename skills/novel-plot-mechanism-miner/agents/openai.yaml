interface:
  display_name: "剧情机制横向拆解器"
  short_description: "从多个剧情实例中提炼可复用的触发、运行、升级、兑现与状态变化结构"
  default_prompt: "使用 $novel-plot-mechanism-miner 横向拆解指定书单中可复用的剧情运行机制。每本书的 per_book 使用 mechanisms[] 覆盖多个独立机制，不得只选一个代表性机制。只使用 orchestrator 允许的书籍、章节和来源；核心对象为 mechanism_identity、trigger_conditions、actors_and_roles、inputs、operations、decision_points、constraints、escalation_logic、outputs、state_transition、repeatability、variation_points、failure_modes、payoff_path。明确 single instance 不等于 mechanism，event list 不等于 operations，forced action 不等于 decision point，世界规则存在不等于 mechanism constraint，numeric inflation 不等于 escalation logic；outputs、state_transition、payoff_path 必须分开。repeatability 必须有多次实例或明确 reusable-rule 证据，不能只写 boolean；single-instance-only 不得补造复用性，也不设固定实例次数阈值。variation points 与 failure modes 独立分析；表面事件相同但运行结构不同不得强行归并，表面事件不同但结构同构可以作为同类 candidate。plotline、arc、opening、character-function、chapter-emotion、worldbuilding、cultivation、golden-finger 只作 interface/evidence，不复制其正式对象。缺证据保留 partial、UNKNOWN、gap 或 HOLD；所有输出保持 candidate-only，禁止 active/deprecated，禁止修改正式素材库；全部目标书完成单书 QA 后才允许 nearest-neighbor / clustering，并用 --expected-books、--all-books-complete 和 --completion-manifest 通过可验证阶段门。固定交付 per_book、nearest_neighbors、clusters、qa、handoff，最终必须通过 scripts/validate_outputs.py；validator 失败时不得补造实例、伪造 decision/repeatability/payoff、删除 UNKNOWN 或按考试/比赛/任务/追杀等关键词强行归类绕过。"
