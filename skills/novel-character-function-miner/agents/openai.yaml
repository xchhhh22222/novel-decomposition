interface:
  display_name: "人物功能横向拆解器"
  short_description: "横向拆解多本小说的人物功能组合、关系发动机与功能阶段变化"
  default_prompt: >-
    使用 $novel-character-function-miner 横向拆解指定书单的人物功能组合、关系发动机与功能阶段变化。只使用 orchestrator 允许的书籍、章节与来源；严格区分 identity facts、narrative functions、relationship functions、function combinations、function transitions、replaceability、protagonist interface、relationship engines；一个人物可以承担多个功能。功能判断必须依赖实际行为、选择、资源流、信息流、冲突结果或关系变化，禁止从性格、身份、职业、实力、出场频率、标签、立绘、名字或简介自动推断；一次送资源不能自动成为长期资源入口，一次争吵、救援或误会不能自动成为长期 relationship engine，实力强不能自动成为导师或威胁。relationship engine 必须有 sustaining condition 和反复产生行动、选择、冲突、资源交换、信息变化、兑现或状态变化的方式；function transition 必须有 before → trigger → after 的章节或阶段证据；replaceability/non-replaceability 必须有具体替代条件或身份、秘密、资源、权力、血缘、历史关系等绑定依据。plotline、arc-structure、plot-mechanism、worldbuilding、cultivation、golden-finger 只作为 interface/evidence，不复制其正式业务对象；chapter emotion 只能引用 reader-emotion overlay，不能把角色心情直接当读者情绪。缺证据时保留 partial、UNKNOWN、gap 或 HOLD；所有输出保持 candidate-only，禁止 active/deprecated，禁止修改正式素材库；全部目标书完成单书 QA 后才允许 nearest-neighbor 和 clustering。最终交付 per_book、nearest_neighbors、clusters、qa、handoff，并通过 skills/novel-character-function-miner/scripts/validate_outputs.py；validator 失败时不得补造人物功能、删除 UNKNOWN 或把单次互动包装成长效机制来强行过检。
