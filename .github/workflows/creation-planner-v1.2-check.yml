name: creation-planner-v1.2-check

on:
  push:
    branches:
      - creation-planner-v1.2-market-climax

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: |
          python -m py_compile skills/novel-creation-planner/scripts/search_dna_candidates.py
          python -m py_compile skills/novel-creation-planner/scripts/validate_creation_plan.py
          python -m py_compile skills/novel-creation-planner/scripts/test_validate_creation_plan.py
          python -m py_compile skills/novel-creation-planner/scripts/test_search_dna_candidates.py
          python -m py_compile skills/novel-creation-planner/scripts/validate_v12_artifacts.py
          python -m py_compile skills/novel-creation-planner/scripts/test_validate_v12_artifacts.py
      - name: V1.1 creation plan regression
        run: python skills/novel-creation-planner/scripts/test_validate_creation_plan.py
      - name: V1.1 component retrieval regression
        run: python skills/novel-creation-planner/scripts/test_search_dna_candidates.py
      - name: V1.2 benchmark and climax regression
        run: python skills/novel-creation-planner/scripts/test_validate_v12_artifacts.py
