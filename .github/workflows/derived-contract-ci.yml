name: derived-contract-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/**"
      - "tests/**"
      - "VERSION"
      - "README.md"
      - ".github/workflows/derived-contract-ci.yml"
  push:
    branches:
      - "main"
      - "v1.6.1-derived-contract"
      - "v1.6.2-supplemental-gates"
      - "v1.6.3-semantic-hold-gates"
      - "v1.6.4-semantic-recluster-reliability"
      - "v1.6.5-semantic-equivalence-lineage"
      - "v1.6.6-semantic-provenance-isolation"
      - "v1.7.0-mechanism-family-architecture"
    paths:
      - "skills/**"
      - "tests/**"
      - "VERSION"
      - "README.md"
      - ".github/workflows/derived-contract-ci.yml"

jobs:
  validate-derived-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Derived material validator regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_derived_materials.py
      - name: Source route validator regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_source_routes_v161.py
      - name: Supplemental batch gates regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_supplemental_batch.py
      - name: Combat semantic gate regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_combat_semantics.py
      - name: Semantic recluster reliability regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_semantic_recluster.py
      - name: Mechanism family pipeline regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_mechanism_family_pipeline.py
      - name: Cross-domain ontology regression
        run: python skills/novel-dna-mining-suite/scripts/core/test_validate_cross_domain_ontology.py
      - name: Repository unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Canonical contract and validator mirrors
        run: |
          cmp skills/novel-dna-orchestrator/references/mechanism-family-contract.md skills/novel-dna-mining-suite/references/core/mechanism-family-contract.md
          cmp skills/novel-dna-orchestrator/references/cross-domain-ontology-contract.md skills/novel-dna-mining-suite/references/core/cross-domain-ontology-contract.md
          cmp skills/novel-dna-orchestrator/scripts/validate_mechanism_family_pipeline.py skills/novel-dna-mining-suite/scripts/core/validate_mechanism_family_pipeline.py
          cmp skills/novel-dna-orchestrator/scripts/validate_cross_domain_ontology.py skills/novel-dna-mining-suite/scripts/core/validate_cross_domain_ontology.py
      - name: Compile validators
        run: |
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_derived_materials.py
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_source_routes.py
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_supplemental_batch.py
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_combat_semantics.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_derived_materials.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_source_routes.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_supplemental_batch.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_combat_semantics.py
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_semantic_recluster.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_semantic_recluster.py
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_mechanism_family_pipeline.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_mechanism_family_pipeline.py
          python -m py_compile skills/novel-dna-mining-suite/scripts/core/validate_cross_domain_ontology.py
          python -m py_compile skills/novel-dna-orchestrator/scripts/validate_cross_domain_ontology.py

